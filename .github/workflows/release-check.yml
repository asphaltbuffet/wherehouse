# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Release Check

on:
  pull_request:
    paths:
      - VERSION

jobs:
  changelog-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert CHANGELOG entry exists for version in VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "Error: VERSION is ${version} but CHANGELOG.md has no '## [${version}]' entry"
            echo "Add a changelog entry before merging."
            exit 1
          fi
          echo "✓ CHANGELOG.md has entry for ${version}"
