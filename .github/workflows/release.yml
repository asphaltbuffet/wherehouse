# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up mise
        uses: jdx/mise-action@v4.2.3

      - uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate code
        run: mise run generate

      - name: Generate completions
        run: mise run completions

      - name: Generate manpages
        run: mise run manpages

      - name: Assert CHANGELOG entry exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "Error: no '## [${VERSION}]' section in CHANGELOG.md"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --release-notes=".changes/${{ steps.version.outputs.version }}.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
