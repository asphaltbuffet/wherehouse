{{define "add_item_form"}}
{{$action := "/entities/add"}}{{if .ParentID}}{{$action = printf "/entities/%s/add" .ParentID}}{{end}}
<form hx-post="{{$action}}"
      hx-target="{{.Target}}"
      hx-swap="beforeend">
  <h2>Add Item</h2>
  <label for="display_name">Display Name</label>
  <input id="display_name" type="text" name="display_name" required autofocus>

  <label for="locked">
    <input id="locked" type="checkbox" name="locked">
    Locked — prevent direct reparenting
  </label>

  <label for="discrete">
    <input id="discrete" type="checkbox" name="discrete">
    Discrete — no children allowed
  </label>

  <div class="modal-actions">
    <button type="submit" class="btn-primary">Add</button>
    <button type="button" class="btn-ghost"
            data-action="close-add-modal">Cancel</button>
  </div>
</form>
{{end}}
