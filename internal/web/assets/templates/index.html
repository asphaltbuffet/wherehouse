{{define "index"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wherehouse</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav id="tree-panel">

</html>{{end}}
