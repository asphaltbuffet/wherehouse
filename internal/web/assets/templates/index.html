{{define "index"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wherehouse</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav id="tree-panel">
    <div id="tree-panel-header">
      <span>Inventory</span>
      <button class="add-root-btn"
              title="Add root item"
              onclick="htmx.ajax('GET','/entities/add',{target:'#add-modal-body',swap:'innerHTML'});document.getElementById('add-modal').showModal()">+</button>
    </div>
    <ul id="tree-root-list" class="tree-node">
      {{range .Roots}}
        {{template "tree_node" .}}
      {{end}}
    </ul>
  </nav>
  <main id="detail-panel">
    <p style="color:#888">Select an item to see details.</p>
  </main>

  <dialog id="add-modal">
    <div id="add-modal-body"></div>
  </dialog>
</body>
</html>{{end}}
