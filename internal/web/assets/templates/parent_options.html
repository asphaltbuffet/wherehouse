{{define "parent_options"}}
{{if .Gone}}
<li class="parent-options-empty" role="alert">This item no longer exists</li>
{{else if .Query}}
{{range .Results}}
<li>
  <button type="button" class="btn-link parent-option"
          data-action="pick-parent"
          data-parent-id="{{.Entity.EntityID}}"
          data-parent-path="{{.Entity.FullPathDisplay}}">{{.Entity.FullPathDisplay}}</button>
</li>
{{else}}
<li class="parent-options-empty">No matching locations</li>
{{end}}
{{end}}
{{end}}
