{{define "breadcrumbs"}}
<nav class="breadcrumbs" aria-label="Location path">
  <a hx-get="/" hx-target="#detail-panel" hx-swap="innerHTML" hx-push-url="true" href="/">Inventory</a>
  {{range .}}
    <span class="sep" aria-hidden="true">›</span>
    {{if .EntityID}}
      <a hx-get="/entities/{{.EntityID}}" hx-target="#detail-panel" hx-swap="innerHTML" hx-push-url="true" href="/entities/{{.EntityID}}">{{.Name}}</a>
    {{else}}
      <span aria-current="page">{{.Name}}</span>
    {{end}}
  {{end}}
</nav>
{{end}}
