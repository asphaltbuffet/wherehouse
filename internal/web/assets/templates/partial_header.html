{{define "header"}}
<header class="app-header">
  <button id="tree-toggle" class="btn-ghost tree-toggle" type="button" aria-controls="tree-panel" aria-expanded="false">Inventory</button>
  <a class="app-brand" href="/"><span class="app-brand-mark" aria-hidden="true"></span><span class="app-brand-name">Wherehouse</span></a>
  <a class="app-nav-link" href="/reports">Reports</a>
  <form class="app-search"
        role="search"
        hx-get="/search"
        hx-target="#detail-panel"
        hx-trigger="submit, keyup changed delay:300ms from:#q"
        action="/search"
        hx-push-url="true">
    <label for="q" class="visually-hidden">Search inventory</label>
    <input id="q" name="q" type="search" placeholder="Search items and locations…" autocomplete="off">
  </form>
</header>
{{end}}
