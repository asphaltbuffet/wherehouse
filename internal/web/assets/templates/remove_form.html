{{define "remove_form"}}
<form class="remove-form form-panel" data-action="remove" data-esc-cancel
      hx-post="/entities/{{.EntityID}}/actions/remove"
      hx-target="#detail-panel" hx-swap="innerHTML">
  {{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
  <p id="remove_prompt">Remove {{.DisplayName}} from the inventory? This cannot be undone.</p>
  <label for="remove_note">Note (optional)</label>
  <input id="remove_note" type="text" name="note" value="{{.Note}}" aria-describedby="remove_prompt" autofocus>
  <div class="remove-form-buttons">
    <button type="submit" class="btn-primary">Remove</button>
    <button type="button" class="btn-ghost" data-action="cancel"
            hx-get="/entities/{{.EntityID}}"
            hx-target="#entity-detail" hx-swap="outerHTML">Cancel</button>
  </div>
</form>
{{end}}
