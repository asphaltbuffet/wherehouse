{{define "status_form"}}
<form class="status-form form-panel" data-action="{{.Action}}" data-esc-cancel
      hx-post="/entities/{{.EntityID}}/actions/{{.Action}}"
      hx-target="#detail-panel" hx-swap="innerHTML">
  {{with .Prompt}}<p>{{.}}</p>{{end}}
  <label for="status_note">Note (optional)</label>
  <input id="status_note" type="text" name="note" value="{{.Note}}" autofocus>
  <div class="status-form-buttons">
    <button type="submit" class="btn-primary">{{.Submit}}</button>
    <button type="button" class="btn-ghost" data-action="cancel"
            hx-get="/entities/{{.EntityID}}"
            hx-target="#entity-detail" hx-swap="outerHTML">Cancel</button>
  </div>
</form>
{{end}}
