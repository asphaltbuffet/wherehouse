{{define "tree_node"}}
<li>
  <div class="tree-item"
       hx-get="/tree/{{.EntityID}}/children"
       hx-target="next .tree-children"
       hx-swap="innerHTML"
       hx-trigger="click[!this.dataset.expanded] once"
       hx-on:htmx:after-request="this.dataset.expanded='1'"
       hx-push-url="false"
       onclick="(function(el){
         document.querySelectorAll('.tree-item').forEach(e=>e.classList.remove('selected'));
         el.classList.add('selected');
         htmx.ajax('GET','/entities/{{.EntityID}}',{target:'#detail-panel',swap:'innerHTML'});
         if (el.dataset.expanded) {
           var ch = el.nextElementSibling;
           ch.classList.toggle('collapsed');
           el.querySelector('.chevron').classList.toggle('open');
         }
       })(this)">
    {{if .HasChildren}}<span class="chevron">▶</span>{{else}}<span class="chevron-placeholder"></span>{{end}}
    <span>{{entityTypeIcon .EntityType}}</span>
    <span>{{.DisplayName}}</span>
    {{$cls := statusClass .Status}}{{if $cls}}<span class="badge {{$cls}}">{{.Status}}</span>{{end}}
    {{if ne .EntityType 3}}
    <button class="add-btn"
            title="Add item here"
            onclick="event.stopPropagation();htmx.ajax('GET','/entities/{{.EntityID}}/add',{target:'#add-modal-body',swap:'innerHTML'});document.getElementById('add-modal').showModal()">+</button>
    {{end}}
  </div>
  <ul id="tree-children-{{.EntityID}}" class="tree-children tree-node{{if .HasChildren}} collapsed{{end}}"></ul>
</li>
{{end}}
