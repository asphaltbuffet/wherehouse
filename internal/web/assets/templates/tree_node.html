{{define "tree_node"}}
<li role="treeitem"
    aria-selected="false"
    {{if .HasChildren}}aria-expanded="false"{{end}}
    aria-label="{{.DisplayName}}">
  <div class="tree-item"
       tabindex="0"
       data-entity-id="{{.EntityID}}"
       hx-get="/entities/{{.EntityID}}"
       hx-target="#detail-panel"
       hx-swap="innerHTML"
       hx-push-url="true">
    <span class="chevron{{if not .HasChildren}} chevron-hidden{{end}}" aria-hidden="true">
      <svg viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4-4 4"/></svg>
    </span>
    <span aria-hidden="true">{{entityTypeIcon .EntityType}}</span>
    <span id="tree-label-{{.EntityID}}">{{.DisplayName}}</span>
    {{$cls := statusClass .Status}}<span id="tree-badge-{{.EntityID}}" class="badge {{$cls}}">{{if $cls}}{{.Status}}{{end}}</span>
    {{if ne .EntityType 3}}
    <button class="add-btn"
            type="button"
            data-parent-id="{{.EntityID}}"
            aria-label="Add child item under {{.DisplayName}}">+</button>
    {{end}}
  </div>
  <ul id="tree-children-{{.EntityID}}"
      class="tree-children tree-node{{if .HasChildren}} collapsed{{end}}"
      role="group"></ul>
</li>
{{end}}
